# Hub75 Test Sketch

esphome:
  name: hub75-test
  friendly_name: HUB75 Test

external_components:
  - source: github://TillFleisch/ESPHome-HUB75-MatrixDisplayWrapper@main

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

# api:
#   encryption:
