# Single panel 64x64 HUB75 display
# https://github.com/TillFleisch/ESPHome-HUB75-MatrixDisplayWrapper/tree/main

# Based on this example
# https://github.com/TillFleisch/ESPHome-HUB75-MatrixDisplayWrapper/blob/main/example.yaml

# CP210x Universal Windows Driver
# https://www.silabs.com/software-and-tools/usb-to-uart-bridge-vcp-drivers?tab=downloads

# Flash with ESPHome Web (holding down BOOT btn)
# https://web.esphome.io/

esphome:
  name: hub75-64x64
  friendly_name: 64x64 Matrix

external_components:
  - source: github://TillFleisch/ESPHome-HUB75-MatrixDisplayWrapper@main

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

# api:
#   encryption:
#     key: "kjdfgkjhHJKjkkjdfgkjhdfgkjdfghkretkjhdfgdfg="

# ota:
#   - platform: esphome

# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password

#   ap:
#     ssid: "hub75-64x64"
#     password: "setupMatrix"

# captive_portal:

# ==========================================================

# https://esphome.io/components/animation/
animation:
  - file: "gifs/matrix-spin.gif"
    id: gif_matrix
    type: RGB565

  - file: "gifs/ezgif.com-pacmn.gif"
    id: gif_pacman
    #resize: 48x24
    #resize: 32x16
    type: RGB565

font:
  # gfonts://family[@weight]
  - file: "gfonts://Roboto"
    id: roboto
    size: 10

color:
  - id: red
    hex: FF0000
  - id: blue
    hex: 0000FF

display:
  - platform: hub75_matrix_display
    id: matrix
    width: 64
    height: 64
    chain_length: 1
    brightness: 90

    # SHIFTREG (default), FM6124, FM6126A, ICN2038S, MBI5124, SM5266, DP3246_SM5368
    driver: FM6124

    # use pin E because of 64 rows
    E_pin: 32

    # re-define with default values, but disable strapping warnings
    C_pin:
      number: 5
      ignore_strapping_warning: true
    OE_pin:
      number: 15
      ignore_strapping_warning: true
    G2_pin:
      number: 12
      ignore_strapping_warning: true

    # draw something
    lambda: |-
      it.image(0, 5, id(gif_pacman));

      it.filled_rectangle(0, 0, 64, 10, id(blue));
      it.print(8, -1, id(roboto), "Session 56");
      it.line(0, 0, 63, 0, id(red));
      it.line(0, 10, 63, 10, id(red));

      it.image(0, 32, id(gif_matrix));

interval:
  - interval: 50ms
    then:
      - animation.next_frame: gif_matrix
      - animation.next_frame: gif_pacman

