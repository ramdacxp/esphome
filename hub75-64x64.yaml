# Single panel 64x64 HUB75 display
# https://github.com/TillFleisch/ESPHome-HUB75-MatrixDisplayWrapper/tree/main

# Based on this example
# https://github.com/TillFleisch/ESPHome-HUB75-MatrixDisplayWrapper/blob/main/example.yaml

esphome:
  name: hub75-64x64
  friendly_name: 64x64 Matrix

external_components:
  - source: github://TillFleisch/ESPHome-HUB75-MatrixDisplayWrapper@main

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "kjdfgkjhHJKjkkjdfgkjhdfgkjdfghkretkjhdfgdfg="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "hub75-64x64"
    password: "setupMatrix"

captive_portal:

# ==========================================================

font:
  # gfonts://family[@weight]
  - file: "gfonts://Roboto"
    id: roboto
    size: 10

display:
  - platform: hub75_matrix_display
    id: matrix
    width: 64
    height: 64
    chain_length: 1
    brightness: 90

    # defined E because of 64 rows
    E_pin: 32

    # re-define with default values, but disable strapping warnings
    C_pin:
      number: 5
      ignore_strapping_warning: true
    OE_pin:
      number: 15
      ignore_strapping_warning: true
    G2_pin:
      number: 12
      ignore_strapping_warning: true

    # draw something
    lambda: |-
      it.print(0, 0, id(roboto), "Hello World!");

switch:
  - platform: hub75_matrix_display
    matrix_id: matrix
    name: "Power"
    id: power

number:
  - platform: hub75_matrix_display
    matrix_id: matrix
    name: "Brightness"