font:
  # gfonts://family[@weight]
  - file: "gfonts://Roboto"
    id: roboto
    size: 10
    glyphs: [
      0123456789,
      abcdefghijklmnopqrstuvwxyz,
      ABCDEFGHIJKLMNOPQRSTUVWXYZ,
      ÄÖÜäöüß,
      (,),+,-,_,.,°,•,
      "\u0020", # space
      "\u002C", # ,
      "\u0021", # !
      "\u0022", # "
      "\u0027", # '
      ]

color:
  - id: black
    hex: "000000"
  - id: red
    hex: "FF0000"
  - id: green
    hex: "00FF00"
  - id: blue
    hex: "0000FF"
  - id: orange
    hex: "FF7700"

display:
  - platform: hub75_matrix_display
    id: matrix
    width: 64
    height: 64
    chain_length: 1
    brightness: 90
    # SHIFTREG (default), FM6124, FM6126A, ICN2038S, MBI5124, SM5266, DP3246_SM5368
    driver: FM6124
    clock_phase: false

    # use pin E because of 64 rows
    E_pin: 32

    # re-define with default values, but disable strapping warnings
    C_pin:
      number: 5
      ignore_strapping_warning: true
    OE_pin:
      number: 15
      ignore_strapping_warning: true
    G2_pin:
      number: 12
      ignore_strapping_warning: true

    # draw something
    lambda: |-
      it.fill(id(black));
      PrintCenteredMultiline(&it, id(roboto), id(red), "Session •56•\nÄÖÜäöüß\n3rd Line");
      it.rectangle(0, 0, 64, 64, id(orange));
