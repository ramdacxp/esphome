# ESPHome version of Framed Utopia

# based on this sketch
# https://github.com/Esshahn/esp32-dotmatrix-utopia-offline/blob/main/esp32-dotmatrix-utopia-offline.ino

esphome:
  name: utopia
  friendly_name: Framed Utopia
  includes:
    - utopia.h

external_components:
  - source: github://TillFleisch/ESPHome-HUB75-MatrixDisplayWrapper@main

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

# api:
#   encryption:
#     key: "kjdfgkjhHJKjkkjdfgkjhdfgkjdfghkretkjhdfgdfg="

# ota:
